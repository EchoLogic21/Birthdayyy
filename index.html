<!-- JAVASCRIPT -->

<script>

const wrap1 =
document.getElementById("cassetteWrap1");

const button1 =
document.getElementById("cassetteButton1");

const audio1 =
document.getElementById("voiceNote1");


const wrap2 =
document.getElementById("cassetteWrap2");

const button2 =
document.getElementById("cassetteButton2");

const audio2 =
document.getElementById("voiceNote2");


function setupCassette(
button,
wrap,
audio,
popup = false
) {

button.addEventListener(
"click",
async () => {

if (audio.ended) {

audio.currentTime = 0;

if (popup) {

wrap.classList.remove(
"show-popup"
);

}

}


if (!audio.paused) {

audio.pause();

wrap.classList.remove(
"is-playing"
);

return;

}


try {

await audio.play();

wrap.classList.add(
"is-playing"
);

if (popup) {

wrap.classList.remove(
"show-popup"
);

}

}

catch (error) {

console.log(
"Voice note could not play:",
error
);

}

});


audio.addEventListener(
"ended",
() => {

wrap.classList.remove(
"is-playing"
);

if (popup) {

setTimeout(
() => {

wrap.classList.add(
"show-popup"
);

},
450
);

}

});

}


setupCassette(
button1,
wrap1,
audio1
);


setupCassette(
button2,
wrap2,
audio2,
true
);

</script>
